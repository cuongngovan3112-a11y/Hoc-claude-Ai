<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Đăng nhập — MASTER.AI</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
*, *::before, *::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}
:root {
  --bg: #07071A;
  --card: #111127;
  --input-bg: #16162F;
  --border: rgba(99,102,241,.2);
  --primary: #6366F1;
  --primary-hover: #4F46E5;
  --text-main: #F1F5F9;
  --text-muted: #94A3B8;
  --grad: linear-gradient(135deg, #6366F1, #8B5CF6);
  --pl: #818CF8;
}
body {
  font-family: 'Inter', sans-serif;
  background-color: var(--bg);
  color: var(--text-main);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
  position: relative;
  z-index: 1;
}
body::before {
  content: '';
  position: fixed;
  top: -200px;
  left: 50%;
  transform: translateX(-50%);
  width: 800px;
  height: 600px;
  background: radial-gradient(ellipse, rgba(99,102,241,.15) 0%, transparent 70%);
  pointer-events: none;
  z-index: -1;
}
/* Logo */
.logo {
  display: flex;
  align-items: center;
  gap: 12px;
  font-size: 26px;
  font-weight: 900;
  margin-bottom: 32px;
  letter-spacing: -0.5px;
}
.logo-icon {
  width: 42px;
  height: 42px;
  background: var(--grad);
  border-radius: 12px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-size: 22px;
  color: #fff;
}
.logo span.ai {
  color: var(--pl);
}

/* Card */
.auth-card {
  background-color: var(--card);
  width: 100%;
  max-width: 420px;
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 32px;
}

/* Tab Bar */
.tab-bar {
  display: flex;
  background-color: var(--input-bg);
  border-radius: 10px;
  margin-bottom: 24px;
  border: 1px solid var(--border);
  padding: 4px;
}
.tab-btn {
  flex: 1;
  padding: 12px;
  text-align: center;
  border-radius: 8px;
  border: 1px solid transparent;
  cursor: pointer;
  font-size: 14px;
  font-weight: 600;
  color: var(--text-muted);
  transition: 0.2s;
}
.tab-btn.active {
  color: var(--text-main);
  border-color: var(--pl);
  background-color: rgba(99,102,241,.08);
}

/* Form */
.form-group {
  margin-bottom: 18px;
}
.form-label {
  display: block;
  font-size: 13px;
  font-weight: 600;
  margin-bottom: 8px;
  color: var(--text-main);
}
.form-input {
  width: 100%;
  padding: 13px 16px;
  background-color: var(--input-bg);
  border: 1.5px solid var(--border);
  border-radius: 8px;
  color: var(--text-main);
  font-size: 14px;
  font-family: inherit;
  outline: none;
  transition: 0.2s;
}
.form-input:focus {
  border-color: var(--primary);
  box-shadow: 0 0 0 3px rgba(99,102,241,.12);
}

/* Button */
.btn-primary {
  width: 100%;
  padding: 14px;
  background: var(--grad);
  color: #fff;
  border: none;
  border-radius: 8px;
  font-size: 15px;
  font-weight: 700;
  cursor: pointer;
  margin-top: 8px;
  transition: 0.2s;
  font-family: inherit;
}
.btn-primary:hover {
  opacity: 0.9;
  transform: translateY(-1px);
}

/* Divider */
.divider {
  display: flex;
  align-items: center;
  text-align: center;
  margin: 24px 0;
  color: var(--text-muted);
  font-size: 12px;
}
.divider::before, .divider::after {
  content: '';
  flex: 1;
  border-bottom: 1px solid var(--border);
}
.divider:not(:empty)::before {
  margin-right: 12px;
}
.divider:not(:empty)::after {
  margin-left: 12px;
}

/* Google Button */
.btn-google {
  width: 100%;
  padding: 13px;
  background-color: var(--input-bg);
  color: var(--text-main);
  border: 1px solid var(--border);
  border-radius: 8px;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 12px;
  transition: 0.2s;
  font-family: inherit;
}
.btn-google:hover {
  background-color: rgba(99,102,241,.05);
}
.btn-google img {
  width: 18px;
  height: 18px;
}

/* Footer Links */
.footer-link {
  display: block;
  text-align: center;
  margin-top: 24px;
  color: var(--text-muted);
  font-size: 13px;
  text-decoration: none;
  transition: 0.2s;
}
.footer-link:hover {
  color: var(--pl);
}
</style>
</head>
<body>

<div class="logo">
  <div class="logo-icon">⚡</div>
  <span>MASTER <span class="ai">.AI</span></span>
</div>

<div class="auth-card">
  <div class="tab-bar">
    <div class="tab-btn active" id="tabLogin" onclick="switchTab('login')">Đăng nhập</div>
    <div class="tab-btn" id="tabRegister" onclick="switchTab('register')">Đăng ký</div>
  </div>

  <div id="loginForm">
    <div class="form-group">
      <label class="form-label">Email</label>
      <input type="email" class="form-input" id="loginEmail" placeholder=" ">
    </div>
    <div class="form-group">
      <label class="form-label">Mật khẩu</label>
      <input type="password" class="form-input" id="loginPass" placeholder=" ">
    </div>
    <button class="btn-primary" onclick="doAction('login')">Đăng nhập</button>
  </div>

  <div id="registerForm" style="display: none;">
    <div class="form-group">
      <label class="form-label">Họ tên</label>
      <input type="text" class="form-input" id="regName" placeholder=" ">
    </div>
    <div class="form-group">
      <label class="form-label">Email</label>
      <input type="email" class="form-input" id="regEmail" placeholder=" ">
    </div>
    <div class="form-group">
      <label class="form-label">Mật khẩu</label>
      <input type="password" class="form-input" id="regPass" placeholder=" ">
    </div>
    <button class="btn-primary" onclick="doAction('register')">Tạo tài khoản</button>
  </div>

  <div class="divider">HOẶC</div>

  <button class="btn-google">
    <img src="https://www.svgrepo.com/show/475656/google-color.svg" alt="Google">
    Tiếp tục với Google
  </button>

  <a href="index.html" class="footer-link">Quay lại trang chủ</a>
</div>

<script>
function switchTab(tab) {
  const isLogin = tab === 'login';
  document.getElementById('tabLogin').classList.toggle('active', isLogin);
  document.getElementById('tabRegister').classList.toggle('active', !isLogin);
  document.getElementById('loginForm').style.display = isLogin ? 'block' : 'none';
  document.getElementById('registerForm').style.display = isLogin ? 'none' : 'block';
}

function doAction(action) {
  if (action === 'login') {
    const email = document.getElementById('loginEmail').value;
    const pass = document.getElementById('loginPass').value;
    if (!email || !pass) {
      alert("Vui lòng nhập đầy đủ thông tin");
      return;
    }
  } else {
    const name = document.getElementById('regName').value;
    const email = document.getElementById('regEmail').value;
    const pass = document.getElementById('regPass').value;
    if (!name || !email || !pass) {
      alert("Vui lòng nhập đầy đủ thông tin");
      return;
    }
  }
  // Giả lập xử lý và chuyển hướng về dashboard
  alert((action==='login'?'Đăng nhập':'Đăng ký') + " thành công!");
  window.location.href = 'dashboard.html';
}
</script>

</body>
</html>
