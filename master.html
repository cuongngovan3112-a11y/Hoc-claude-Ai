const frame = document.getElementById('appFrame');
function decodePage(page){
  return new TextDecoder('utf-8').decode(Uint8Array.from(atob(B64[page]), c => c.charCodeAt(0)));
}
function go(page){
  if(!B64[page]) page='sale';
  location.hash = page;
  frame.srcdoc = decodePage(page);
}
window.addEventListener('message', function(e){
  if(e.data && e.data.type === 'MASTER_AI_ROUTE') go(e.data.page);
});
window.addEventListener('hashchange', function(){ go((location.hash||'#sale').slice(1)); });
go((location.hash||'#sale').slice(1));
</script>
